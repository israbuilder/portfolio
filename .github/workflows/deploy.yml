name: Deploy Production

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Test and validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, bcmath, intl, pdo_mysql
          coverage: none

      - name: Install PHP dependencies for tests
        run: |
          composer install \
            --prefer-dist \
            --no-interaction \
            --no-progress

      - name: Prepare Laravel test environment
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend assets for tests
        run: npm run build

      - name: Run tests
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: php artisan test

  deploy:
    name: Deploy to VPS
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: production

    steps:
      - name: Configure SSH and Validate Target Path
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          SUBDIR: ${{ secrets.VPS_PATH }}
        run: |
          set -euo pipefail

          # 1. Path traversal and empty variable guardrail
          if [ -z "${SUBDIR// }" ]; then
            echo "::error::CRITICAL ERROR: VPS_PATH is not defined or is empty in GitHub Secrets."
            exit 1
          fi

          if [[ "$SUBDIR" == /* ]] || [[ "$SUBDIR" == *".."* ]]; then
            echo "::error::CRITICAL ERROR: VPS_PATH must not start with a leading slash '/' or contain '..': $SUBDIR"
            exit 1
          fi

          # 2. Configure SSH credentials on the GitHub Actions runner
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Execute remote Git deployment
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          SUBDIR: ${{ secrets.VPS_PATH }}
        run: |
          set -euo pipefail
          TARGET_PATH="/var/www/$SUBDIR"

          ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "bash -s" << 'EOF' "$TARGET_PATH"
            set -euo pipefail

            APP_PATH="$1"

            # 1. Precondition checks: directory, git repo, and production environment file
            if [ ! -d "$APP_PATH" ]; then
              echo "ERROR: Target directory $APP_PATH does not exist on the server."
              exit 1
            fi

            cd "$APP_PATH"

            if [ ! -d ".git" ]; then
              echo "ERROR: $APP_PATH is not a valid Git repository."
              exit 1
            fi

            if [ ! -f .env ]; then
              echo "ERROR: Production .env file does not exist in $APP_PATH."
              exit 1
            fi

            # 2. Enter maintenance mode
            php artisan down --retry=60 || true

            # 3. Pull latest code cleanly via Git (preserves untracked files like .env and storage)
            git fetch origin main
            git reset --hard origin/main

            # Enforce Node 22 binary path from NVM
            export PATH=/root/.nvm/versions/node/v22.22.0/bin:$PATH

            # 4. Install production PHP dependencies
            composer install \
              --no-dev \
              --prefer-dist \
              --optimize-autoloader \
              --no-interaction \
              --no-progress

            # 5. Build frontend assets if package.json exists (leverages swap to prevent OOM)
            if [ -f "package.json" ]; then
              npm ci --prefer-offline --no-audit
              npm run build
              rm -rf node_modules
            fi

            # 6. Database migrations and framework cache optimization
            php artisan migrate --force
            php artisan optimize:clear
            php artisan optimize

            php artisan storage:link || true
            php artisan queue:restart || true

            # 7. Ensure correct file ownership and permissions for the web server
            sudo chown -R www-data:www-data storage bootstrap/cache
            sudo chmod -R 775 storage bootstrap/cache

            # 8. Bring the application back online
            php artisan up
            php artisan about --only=environment
          EOF

      - name: Restore application on failure
        if: failure()
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          SUBDIR: ${{ secrets.VPS_PATH }}
        run: |
          TARGET_PATH="/var/www/$SUBDIR"
          ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "cd '$TARGET_PATH' && php artisan up || true"
